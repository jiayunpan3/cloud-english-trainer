];


let current = 0;

let playing = false;

let timers = [];

function render(){

const item = vocab[current];

document.getElementById("term")
.innerText = item.term;

document.getElementById("sentence")
.innerText = item.sentence;

document.getElementById("zh")
.innerText = item.zh;

document.getElementById("counter")
.innerText =
(current + 1)
+ " / "
+ vocab.length;
}

function speak(text,lang){

let utter =
new SpeechSynthesisUtterance(text);

utter.lang = lang;

utter.rate =
parseFloat(
document.getElementById("speed").value
);

speechSynthesis.speak(utter);

}

function clearTimers(){

timers.forEach(clearTimeout);

timers=[];
}

function playCurrent(){

clearTimers();

speechSynthesis.cancel();

let item = vocab[current];

let delay = 0;

timers.push(

setTimeout(()=>{

speak(
item.term,
"en-US"
);

},delay)

);

delay += 3000;

timers.push(

setTimeout(()=>{

speak(
item.sentence,
"en-US"
);

},delay)

);

delay += 6000;

timers.push(

setTimeout(()=>{

speak(
item.zh,
"zh-CN"
);

},delay)

);

delay += 2500;

timers.push(

setTimeout(()=>{

if(playing){

current++;

if(
current >= vocab.length
){
current = 0;
}

render();

playCurrent();

}

},delay)

);

}

function startAll(){

playing=true;

playCurrent();

}

function pauseAll(){

speechSynthesis.pause();

}

function resumeAll(){

speechSynthesis.resume();

}

function stopAll(){

playing=false;

speechSynthesis.cancel();

clearTimers();

}

function nextWord(){

current++;

if(
current>=vocab.length
){
current=0;
}

render();
}

function prevWord(){

current--;

if(
current<0
){
current=
vocab.length-1;
}

render();
}

render();

</script>
